<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка · AeroHub</title>
<link rel="icon" href="img/icon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><span class="mark">A</span>AeroHub</a>
  <nav class="links"><a href="/account">Кабинет</a></nav>
</div></header>
<div class="page"><div class="wrap wide stack">
  <h1 style="margin:0">Админка</h1>

  <div class="card">
    <h3>Выпустить ключи</h3>
    <form id="gen" class="row" style="margin-top:6px">
      <div><label for="c">Сколько</label><input id="c" name="count" type="number" min="1" max="100" value="1" required></div>
      <div><label for="d">Тариф</label>
        <select id="d" name="days"><option value="7">Неделя</option><option value="30" selected>Месяц</option><option value="0">Навсегда</option></select></div>
      <div style="flex-basis:100%"><label>Игры</label><div id="games"></div></div>
      <div><label for="n">Заметка</label><input id="n" name="note" maxlength="80" placeholder="кому / за что"></div>
      <button class="btn primary" type="submit">Выпустить</button>
      <div class="msg" style="flex-basis:100%"></div>
    </form>
    <div id="newkeys" class="newkeys" hidden></div>
  </div>

  <div class="card">
    <h3>Ключи</h3>
    <div class="filters">
      <div id="whobox"><label for="who">Кто выпустил</label>
        <select id="who"><option value="all">Все</option><option value="mine">Мои</option><option value="head">Главные админы</option><option value="admin">Админы</option></select></div>
      <div><label for="q">Поиск</label><input id="q" placeholder="ник, ключ или заметка"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="tablebox"><table>
      <thead><tr><th>Ключ</th><th>Статус</th><th>Игры</th><th>Дней</th><th>Выпустил</th><th>Активировал</th><th>До</th><th>ПК</th><th>Заметка</th><th></th></tr></thead>
      <tbody id="keys"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>Пользователи</h3>
    <p id="roles-note" hidden>Роли меняет только владелец.</p>
    <div class="tablebox"><table>
      <thead><tr><th>Логин</th><th>Роль</th><th>Создан</th></tr></thead>
      <tbody id="users"></tbody>
    </table></div>
  </div>
</div></div>
<script src="app.js"></script>
<script>
let catalog = {}, me = {}, allKeys = [];
const ROLE_RU = { player: 'игрок', admin: 'админ', head: 'главный админ', owner: 'владелец' };
// Game checkboxes: "Весь хаб" (every game, including future ones) or individual games.
function gamePicker(selected) {
  const all = selected.includes('*');
  const box = el('div', { class: 'checks' });
  const allBox = el('input', { type: 'checkbox', value: '*' });
  allBox.checked = all;
  box.append(el('label', { class: 'check strong' }, allBox, 'Весь хаб (все игры, и новые тоже)'));
  const singles = Object.entries(catalog).map(([id, name]) => {
    const i = el('input', { type: 'checkbox', value: id });
    i.checked = all || selected.includes(id);
    i.disabled = all;
    box.append(el('label', { class: 'check' }, i, name));
    return i;
  });
  allBox.addEventListener('change', () => singles.forEach(i => { i.disabled = allBox.checked; if (allBox.checked) i.checked = true; }));
  box.value = () => allBox.checked ? ['*'] : singles.filter(i => i.checked).map(i => i.value);
  return box;
}
const toDateInput = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

function editor(k, row) {
  const picker = gamePicker(k.gameIds || []);
  const note = el('input', { value: k.note || '', maxlength: '80', placeholder: 'заметка' });
  const msg = el('div', { class: 'msg' });
  let when;
  if (k.username) {
    const forever = el('input', { type: 'checkbox' });
    forever.checked = !k.expires;
    const date = el('input', { type: 'date', value: k.expires ? toDateInput(k.expires) : toDateInput(Date.now() + 30 * 864e5) });
    date.disabled = forever.checked;
    forever.addEventListener('change', () => { date.disabled = forever.checked; });
    when = el('div', {}, el('label', {}, 'Действует до'), date, el('label', { class: 'check', style: 'margin-top:10px' }, forever, 'Навсегда'));
    when.value = () => forever.checked ? null : new Date(date.value + 'T23:59:59').getTime();
  } else {
    const days = el('select', {}, ...[['7', 'Неделя'], ['30', 'Месяц'], ['0', 'Навсегда']].map(([v, t]) => {
      const o = el('option', { value: v }, t); if (Number(v) === k.days) o.selected = true; return o; }));
    when = el('div', {}, el('label', {}, 'Тариф (с момента активации)'), days);
    when.value = () => Number(days.value);
  }
  const save = el('button', { class: 'btn small primary', type: 'button', onclick: async () => {
    const body = { key: k.key, games: picker.value(), note: note.value };
    if (k.username) body.expires = when.value(); else body.days = when.value();
    const r = await api('/api/admin/key-edit', body);
    if (!r.ok) { msg.className = 'msg err'; msg.textContent = r.data.error || 'Ошибка'; return; }
    toast('Ключ сохранён');
    load();
  } }, 'Сохранить');
  const cancel = el('button', { class: 'btn small', type: 'button', onclick: () => tr.remove() }, 'Отмена');
  const tr = el('tr', { class: 'edit-row' }, el('td', { colspan: 10 },
    el('div', { class: 'editbox' },
      el('div', {}, el('label', {}, 'Игры'), picker), when,
      el('div', {}, el('label', {}, 'Заметка'), note),
      el('div', { class: 'editbtns' }, save, cancel), msg)));
  row.after(tr);
}

function renderKeys() {
  const who = document.getElementById('who').value, q = document.getElementById('q').value.trim().toLowerCase();
  const list = allKeys.filter(k => (who === 'all' || (who === 'mine' ? k.mine : !k.mine && k.creatorRole === who)) &&
    (!q || [k.key, k.creator, k.username, k.note].some(v => String(v || '').toLowerCase().includes(q))));
  document.getElementById('count').textContent = `Показано: ${list.length} из ${allKeys.length}`;
  const keys = document.getElementById('keys');
  keys.replaceChildren();
  if (!list.length) keys.append(el('tr', {}, el('td', { colspan: 10, class: 'empty' }, allKeys.length ? 'Ничего не найдено' : 'Ключей пока нет')));
  for (const k of list) {
    const revoke = el('button', { class: 'btn small', onclick: async () => {
      await api('/api/admin/revoke', { key: k.key, revoked: k.status !== 'revoked' });
      load();
    } }, k.status === 'revoked' ? 'Вернуть' : 'Отозвать');
    const reset = el('button', { class: 'btn small', onclick: async () => {
      await api('/api/admin/reset-hwid', { key: k.key });
      load();
    } }, 'Сброс ПК');
    if (!k.hwidBound) reset.disabled = true;
    const row = el('tr', {},
      el('td', { style: 'white-space:nowrap' }, el('code', {}, k.key), ' ', copyButton(k.key)),
      el('td', {}, el('span', { class: `pill ${k.status}` }, STATUS_RU[k.status] || k.status)),
      el('td', {}, k.allGames ? el('span', { class: 'pill free' }, 'Весь хаб') : (k.games || []).join(', ')),
      el('td', {}, k.days || '∞'),
      el('td', {}, k.creator ? el('span', { class: 'role ' + k.creatorRole, title: ROLE_RU[k.creatorRole] }, k.creator) : '—'),
      el('td', {}, k.username || '—'),
      el('td', {}, k.expires ? fmtDate(k.expires) : (k.username ? 'навсегда' : '—')),
      el('td', {}, k.hwidBound ? 'да' : 'нет'),
      el('td', {}, k.note || ''));
    const edit = el('button', { class: 'btn small', onclick: () => {
      if (row.nextSibling && row.nextSibling.classList && row.nextSibling.classList.contains('edit-row')) row.nextSibling.remove();
      else editor(k, row);
    } }, 'Изменить');
    row.append(el('td', { style: 'white-space:nowrap' }, edit, ' ', revoke, ' ', reset));
    keys.append(row);
  }
}
document.getElementById('who').addEventListener('change', renderKeys);
document.getElementById('q').addEventListener('input', renderKeys);

async function load() {
  const r = await api('/api/admin/overview');
  if (r.status === 401) return (location.href = '/login');
  if (!r.ok) return (location.href = '/account');
  catalog = r.data.catalog || {};
  me = r.data.me || {};
  const gslot = document.getElementById('games');
  if (!gslot.children.length) { const p = gamePicker(Object.keys(catalog)); p.id = 'picker'; gslot.append(p); }
  allKeys = r.data.keys;
  document.getElementById('whobox').hidden = me.role === 'admin';
  renderKeys();
  const users = document.getElementById('users');
  users.replaceChildren(...r.data.users.map(u => {
    let role;
    if (me.owner && u.role !== 'owner') {
      role = el('select', { class: 'rolesel', onchange: async (ev) => {
        const res = await api('/api/admin/role', { userId: u.id, role: ev.target.value });
        toast(res.ok ? 'Роль изменена' : (res.data.error || 'Ошибка'));
        load();
      } }, el('option', { value: 'player' }, 'игрок'), el('option', { value: 'admin' }, 'админ'), el('option', { value: 'head' }, 'главный админ'));
      role.value = u.role;
    } else role = el('span', { class: 'role ' + u.role }, ROLE_RU[u.role] || 'игрок');
    return el('tr', {}, el('td', {}, u.username), el('td', {}, role), el('td', {}, fmtDate(u.created)));
  }));
  document.getElementById('roles-note').hidden = !!me.owner;
}
bindForm(document.getElementById('gen'), async (v) => {
  const games = document.getElementById('picker').value();
  const r = await api('/api/admin/keys', { count: Number(v.count), days: Number(v.days), note: v.note, games });
  if (!r.ok) throw new Error(r.data.error || 'Ошибка');
  const box = document.getElementById('newkeys');
  box.hidden = false;
  box.textContent = r.data.keys.join('\n');
  load();
  return `Выпущено: ${r.data.keys.length}`;
});
load();
</script>
</body>
</html>
