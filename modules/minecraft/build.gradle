plugins {
	id 'fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'aeroclient'
}

loom {
	runs {
		// ./gradlew runSelftest : starts the client, applies every mixin, logs "SELFTEST PASSED|FAILED" and exits
		selftest {
			client()
			property 'aero.selftest', 'true'
			ideConfigGenerated false
		}
		// ./gradlew runWorldtest : creates a flat survival world, builds arenas, runs AutoMine, the navigator and every module
		worldtest {
			client()
			property 'aero.worldtest', 'true'
			programArgs '--width', '1280', '--height', '720'
			ideConfigGenerated false
		}
	}
}

dependencies {
	// ./gradlew runWorldtest -PsodiumJar=<path to sodium-fabric jar> runs the tests with Sodium loaded, to check X-Ray against it
	if (project.hasProperty('sodiumJar')) {
		modLocalRuntime files(project.property('sodiumJar'))
	}
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
