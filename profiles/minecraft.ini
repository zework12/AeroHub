; Hub profile for Minecraft Java with the AeroClient Fabric mod. Nothing is injected: the hub finds the game (a running
; process, the Modrinth App, TLauncher, .minecraft), saves the mod jar to Downloads for you to drop into the mods folder,
; and reads the status file the mod writes while the game runs.
[Profile]
Name=Minecraft
Kind=FabricMod
GameVersion=1.21.1
ModFile=modules\aeroclient.jar
BuildNote=Fabric 1.21.1
Hotkeys=Right Shift or Insert = open the module menu  |  .mine diamond_ore = auto-mine an ore  |  .help = chat commands
